name: compile
on:
  push:
    paths:
      - codex-rs/**
      - justfile
      - .github/actions/**
      - .github/workflows/compile.yml
  pull_request:
    paths:
      - codex-rs/**
      - justfile
      - .github/actions/**
      - .github/workflows/compile.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish the successful binaries under (e.g. v0.1.0). Defaults to 'nightly'.
        required: false
        default: nightly

# Cancel superseded runs so a stale build doesn't finish after a newer one.
concurrency:
  group: compile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cross-compile the primary `codex` binary plus the edited crates for every
  # target triple that the npm `@openai/codex` packages ship, and upload only
  # the targets that build successfully. A target that fails (e.g. the hosted
  # Linux runner running out of RAM during `--release`) is skipped via
  # continue-on-error instead of failing the whole run.
  #
  # Mirror of the release build recipe, compile-only (no signing / staging /
  # packaging) and on GitHub-hosted runners. Non-native architectures are
  # cross-compiled: aarch64 Linux uses an ARM runner, x86_64 apple-darwin is
  # cross-built from the ARM macOS runner, and aarch64-pc-windows-msvc uses the
  # ARM64 MSVC toolchain via the setup-msvc-env action.
  cross-compile:
    name: Compile - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    continue-on-error: true
    defaults:
      run:
        working-directory: codex-rs
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            family: musl
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            family: musl
          - target: x86_64-apple-darwin
            runner: macos-15
            family: darwin
          - target: aarch64-apple-darwin
            runner: macos-15
            family: darwin
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            family: msvc
          - target: aarch64-pc-windows-msvc
            runner: windows-2022
            family: msvc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # setup-ci provisions a Windows Dev Drive and throws if it cannot - the
      # release relies on self-hosted runners for that. On GitHub-hosted Windows
      # we instead point Cargo at a writable temp tree via the msvc branch.
      - if: ${{ matrix.family != 'msvc' }}
        uses: ./.github/actions/setup-ci

      - if: ${{ matrix.family == 'msvc' }}
        name: Configure CI build paths (Windows)
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "codex-cargo"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          "CARGO_TARGET_DIR=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_NET_GIT_FETCH_WITH_CLI=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git config --global core.longpaths true

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      # --- musl (Linux) toolchain: Zig + musl cross tools ---
      - if: ${{ matrix.family == 'musl' }}
        name: Use hermetic Cargo home (musl)
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - if: ${{ matrix.family == 'musl' }}
        name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - if: ${{ matrix.family == 'musl' }}
        name: Install musl build tools
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - if: ${{ matrix.family == 'musl' }}
        name: Disable aws-lc jitter entropy (musl)
        shell: bash
        run: |
          set -euo pipefail
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${{ matrix.target }}"
          target_no_jitter="${target_no_jitter//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"

      # --- Windows (msvc) toolchain: ARM64/MSVC cross environment ---
      - if: ${{ matrix.family == 'msvc' }}
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}

      - name: Cargo build
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          if [[ "$target" == "x86_64-pc-windows-msvc" ]]; then
            export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          fi
          cargo build --target "$target" --release --timings \
            --bin codex \
            --bin codex-exec \
            --bin codex-app-server \
            --bin codex-tui

      # Only runs when `cargo build` above succeeded (with continue-on-error the
      # job stops here on failure, so a failed target uploads nothing). Files are
      # suffixed with the target triple so the publish job can merge them all.
      - name: Stage binaries
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          release_dir="${CARGO_TARGET_DIR}/${target}/release"
          dist_dir="${RUNNER_TEMP}/dist"
          mkdir -p "$dist_dir"
          for bin in codex codex-exec codex-app-server codex-tui; do
            if [[ "$target" == *pc-windows-msvc ]]; then
              src="${release_dir}/${bin}.exe"
              dst="${dist_dir}/${bin}-${target}.exe"
            else
              src="${release_dir}/${bin}"
              dst="${dist_dir}/${bin}-${target}"
            fi
            if [[ -f "$src" ]]; then
              cp "$src" "$dst"
              echo "staged ${dst}"
            else
              echo "WARN: ${src} not found; skipping"
            fi
          done

      - name: Upload binaries
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: binaries-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: warn

  # Publish every target that produced binaries to a GitHub Release. Failed
  # targets simply never uploaded an artifact, so they are ignored here.
  # Only runs for manual workflow_dispatch runs so ordinary pushes/PRs don't
  # create a release.
  publish:
    name: Publish binaries to GitHub Release
    if: github.event_name == 'workflow_dispatch'
    needs: cross-compile
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded binaries
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d dist ]]; then
            find dist -type f | sort
          else
            echo "No binaries were built for any target."
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ inputs.release_tag || 'nightly' }}
          name: ${{ inputs.release_tag || 'nightly' }}
          files: dist/*
          fail_on_unmatched_files: false
          generate_release_notes: true
